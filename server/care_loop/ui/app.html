<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareLoop · __CARELOOP_TITLE__</title>
<style>
  :root { --bg:#ffffff; --fg:#14202b; --muted:#5b6b78; --card:#f3f6f8; --line:#d6dee4; --accent:#0b7a75; --warn:#a15c00; --danger:#b42318; }
  :root[data-theme="dark"] { --bg:#0f1720; --fg:#e7eef3; --muted:#9db0bf; --card:#18232e; --line:#2a3946; --accent:#3cc4bd; --warn:#f0a645; --danger:#ff7a6e; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  h1 { font-size:1.25rem; margin:0; }
  .badge { font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .note { color:var(--muted); font-size:.85rem; margin:0 0 12px; }
  .list { display:grid; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .title { font-weight:600; }
  .meta { color:var(--muted); font-size:.85rem; }
  .cite { margin-top:8px; padding-left:10px; border-left:3px solid var(--accent); color:var(--muted); font-size:.85rem; }
  .status { font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); }
  .status.draft, .status.pending, .status.pending_review, .status.action_required { color:var(--warn); }
  .status.revoked { color:var(--danger); }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:8px 16px; cursor:pointer; background:var(--accent); color:var(--bg); min-height:40px; }
  button.secondary { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  svg { width:100%; height:auto; display:block; }
  .empty, .error { color:var(--muted); padding:24px 0; text-align:center; }
  h2 { font-size:1rem; margin:16px 0 8px; }
  .instruction { margin:8px 0; font-weight:500; }
  .fields { display:grid; grid-template-columns:max-content 1fr; gap:6px 10px; align-items:center; margin:10px 0; }
  .fields input, .card input:not([type=checkbox]) { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .flags { border-left:3px solid var(--warn); padding:6px 10px; margin:8px 0; }
  .flag { color:var(--warn); font-size:.85rem; margin:2px 0; }
  .confirm { display:block; margin-top:6px; font-size:.85rem; }
  .badge { font-size:.75rem; color:var(--muted); margin-left:6px; }
  .badge.warn, .cite.low { color:var(--warn); }
  .review .row:last-child { justify-content:flex-start; margin-top:8px; }
  details summary { cursor:pointer; }
</style>
</head>
<body>
<header><h1>__CARELOOP_TITLE__</h1><span class="badge">Synthetic demo · not medical advice</span></header>
<p class="note" id="note">Loading your private CareLoop view…</p>
<main id="root" class="list" aria-live="polite"></main>
<script>
(() => {
  "use strict";
  const VIEW = "__CARELOOP_VIEW__";
  const PROTOCOL = "2026-01-26";
  const root = document.getElementById("root");
  const note = document.getElementById("note");
  let nextId = 1, refIds = [], hostOrigin = null, loaded = false;
  const pending = new Map();

  // ---- MCP Apps JSON-RPC over postMessage ---------------------------------
  function send(message) { window.parent.postMessage(message, hostOrigin || "*"); }
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      send({ jsonrpc: "2.0", id, method, params });
      setTimeout(() => { if (pending.delete(id)) reject(new Error("timeout")); }, 15000);
    });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (hostOrigin === null && event.origin && event.origin !== "null") hostOrigin = event.origin;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const { resolve, reject } = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "error")) : resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") onToolResult(msg.params || {});
    else if (msg.method === "ui/notifications/host-context-changed") applyContext(msg.params || {});
    else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) send({ jsonrpc: "2.0", id: msg.id, result: {} });
  });

  function applyContext(ctx) {
    if (ctx.theme === "dark" || ctx.theme === "light") document.documentElement.dataset.theme = ctx.theme;
  }
  function reportSize() {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }

  function onToolResult(result) {
    const data = result.structuredContent || {};
    refIds = Array.isArray(data.refs) ? data.refs.map((r) => r.id).filter(Boolean) : [];
    load();
  }

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args });
    if (result && result.isError) throw new Error("CareLoop could not complete that action.");
    return result;
  }

  async function load() {
    loaded = true;
    try {
      const result = await callTool("get_private_view", { view: VIEW, record_ids: refIds });
      let payload = result.structuredContent;
      if (!payload) payload = JSON.parse(((result.content || [])[0] || {}).text || "{}");
      render(payload.data || {});
      note.textContent = "Private view. Not read aloud.";
    } catch (err) {
      root.replaceChildren(el("div", "error", "This view is unavailable. Open CareLoop on your private screen."));
      note.textContent = "";
    }
    reportSize();
  }

  // ---- rendering (textContent only; record data is never parsed as HTML) ----
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = String(text); return n; }
  function when(epoch) { return epoch ? new Date(epoch * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "no expiry"; }
  function status(s) { return el("span", "status " + (s || "active"), (s || "active").replace("_", " ")); }
  function action(label, cls, fn) {
    const b = el("button", cls, label);
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await fn(); await load(); } catch (e) { b.disabled = false; note.textContent = e.message; }
    });
    return b;
  }
  function card(title, state, metaText, button) {
    const c = el("div", "card"), r = el("div", "row"), left = el("div");
    left.append(el("div", "title", title));
    if (metaText) left.append(el("div", "meta", metaText));
    r.append(left);
    const right = el("div", "row");
    if (state) right.append(status(state));
    if (button) right.append(button);
    r.append(right); c.append(r);
    return c;
  }
  function empty(text) { root.replaceChildren(el("div", "empty", text)); }

  const renderers = {
    "plan-review": renderPlan, "tasks": renderPlan,
    "plan-source": (d) => {
      const sources = d.sources || [];
      if (!sources.length) return empty("No reviewed source is linked yet.");
      root.replaceChildren(...sources.map((s) => {
        const c = card(s.title || "Approved source", null, "Clinician-provided source");
        (s.page_excerpts || []).forEach((e) => c.append(el("div", "cite", "p." + e.page + " · " + e.excerpt)));
        return c;
      }));
    },
    "care-circle": (d) => {
      const grants = d.grants || [];
      if (!grants.length) return empty("Nobody has access to your CareLoop yet.");
      root.replaceChildren(...grants.map((g, i) => card(
        "Caregiver access " + (i + 1), g.status,
        (g.scopes || []).join(", ").replaceAll("_", " ") + " · expires " + when(g.expires_at),
        g.status === "active" || g.status === "pending"
          ? action("Revoke", "secondary", () => callTool("revoke_caregiver", { invitation_id: g.id })) : null)));
    },
    "notifications": (d) => {
      const updates = d.updates || [];
      if (!updates.length) return empty("No new CareLoop updates.");
      root.replaceChildren(...updates.map((u, i) => card("CareLoop update " + (i + 1), u.status, "Details stay in the patient's private record.",
        action("Acknowledge", "", () => callTool("acknowledge_alert", { alert_id: u.case_id })))));
    },
    "check-in-trend": renderTrend,
    "visit-handoff": renderHandoff,
    "records": renderRecords, "history": renderRecords,
    "export": (d) => { root.replaceChildren(card("Export ready", null, (d.count || 0) + " records · " + when(d.exported_at))); renderRecords(d, true); },
  };

  function render(data) { (renderers[VIEW] || renderRecords)(data); }

  const KIND_NAMES = { medication_task: "Medicine", care_task: "Care task", appointment: "Appointment",
    warning_sign: "When to get help", rule_candidate: "Alert rule", note: "Note" };
  function kindOf(item) { return KIND_NAMES[item.item_kind] || (item.type === "PLAN_RULE" ? "Follow-up rule" : item.type === "PLAN_NOTE" ? "Note" : "Task"); }
  function sourceLines(item, c) {
    if (!item.citation) return;
    (item.citation.excerpts || []).forEach((e) => {
      const ocr = e.method === "ocr", low = ocr && e.confidence_pct < 85;
      const line = el("div", "cite" + (low ? " low" : ""), (e.line_id || "p." + e.page) + " · " + e.excerpt);
      if (ocr) line.append(el("span", "badge" + (low ? " warn" : ""), " read by OCR " + e.confidence_pct + "%"));
      c.append(line);
    });
  }
  function input(value, placeholder, width) {
    const i = document.createElement("input"); i.value = value || ""; i.placeholder = placeholder; if (width) i.style.width = width; return i;
  }

  function reviewCard(item) {
    const isTask = item.type === "PLAN_TASK", reasons = item.review_reasons || [];
    const c = el("div", "card review");
    const head = el("div", "row"); const left = el("div");
    left.append(el("div", "title", item.label || kindOf(item)), el("div", "meta", kindOf(item) + " · needs your approval"));
    head.append(left, status(item.status)); c.append(head);
    c.append(el("p", "instruction", item.text || ""));
    if (item.medication) {
      const m = item.medication, parts = [m.name, m.strength, m.dose, m.route].filter(Boolean);
      if (parts.length) c.append(el("div", "meta", "As written: " + parts.join(" · ")));
    }
    if (item.rule_spec) c.append(el("div", "meta", `Alert when pain score is ${item.rule_spec.threshold} or higher for ${item.rule_spec.consecutive_days} days in a row`));
    sourceLines(item, c);
    const label = input(item.label, "Name Alexa can say aloud");
    const times = isTask && item.frequency !== "as_needed" ? input((item.times || []).join(", "), "Times, e.g. 08:00, 20:00") : null;
    const form = el("div", "fields");
    form.append(el("label", "meta", "Spoken name"), label);
    if (times) form.append(el("label", "meta", "Times (suggested from: " + (item.frequency || "unspecified").replaceAll("_", " ") + ")"), times);
    else if (item.frequency === "as_needed") form.append(el("div", "meta", "As needed: no scheduled times"));
    c.append(form);
    let check = null;
    if (reasons.length) {
      const box = el("div", "flags");
      reasons.forEach((r) => box.append(el("div", "flag", "⚑ " + r)));
      const lab = el("label", "confirm"); check = document.createElement("input"); check.type = "checkbox";
      lab.append(check, document.createTextNode(" I've checked these against the document"));
      box.append(lab); c.append(box);
    }
    const buttons = el("div", "row");
    const approve = action("Approve", "", () => {
      const args = { record_id: item.id, action: "approve", confirmed: !reasons.length || check.checked, label: label.value };
      if (times) args.times = times.value.split(",").map((t) => t.trim()).filter(Boolean);
      return callTool("review_plan_item", args);
    });
    if (check) { approve.disabled = true; check.addEventListener("change", () => { approve.disabled = !check.checked; }); }
    buttons.append(approve, action("Reject", "secondary", () => callTool("review_plan_item", { record_id: item.id, action: "reject" })));
    c.append(buttons);
    return c;
  }

  function renderPlan(d) {
    const items = d.items || [], doc = d.document, parts = [];
    if (doc && VIEW === "plan-review") {
      if (doc.status === "processing") { parts.push(card("Reading your document…", "processing", doc.title || "")); setTimeout(load, 2000); }
      else if (doc.status === "failed") parts.push(card("This document couldn't be read", "failed", doc.error || ""));
      else {
        const methods = Object.values(doc.pages || {}), ocr = methods.filter((m) => m === "ocr").length;
        const how = (ocr ? `${ocr} page(s) read by OCR` : "read from the PDF text") + (doc.engine ? " · structured by " + doc.engine : "");
        const c = card(doc.title || "Uploaded document", null, how);
        (doc.notes || []).forEach((n) => c.append(el("div", "flag", "⚑ " + n)));
        if (doc.follow_up_date) c.append(el("div", "meta", "Follow-up date in the document: " + doc.follow_up_date));
        parts.push(c);
      }
    }
    const pending = items.filter((i) => i.status === "draft" || i.status === "needs_review");
    const done = items.filter((i) => !(i.status === "draft" || i.status === "needs_review"));
    if (VIEW === "plan-review") parts.push(...pending.map(reviewCard));
    const shown = VIEW === "plan-review" ? done : items;
    if (shown.length) {
      if (VIEW === "plan-review" && pending.length) parts.push(el("h2", "", "Already in your plan"));
      parts.push(...shown.map((item) => {
        const state = item.status || "active", isTask = item.type === "PLAN_TASK";
        const button = isTask && state === "active" && VIEW === "tasks"
          ? action("Mark done", "", () => callTool("record_task_completion", { task_id: item.id })) : null;
        const c = card(item.label || item.text || kindOf(item), state,
          kindOf(item) + ((item.times || []).length ? " · " + item.times.join(", ") : item.schedule ? " · " + item.schedule : ""), button);
        if (item.label && item.text) c.append(el("div", "meta", item.text));
        sourceLines(item, c);
        return c;
      }));
    }
    if (doc && (doc.unused_lines || []).length && VIEW === "plan-review") {
      const details = document.createElement("details"); details.className = "card";
      details.append(el("summary", "meta", `${doc.unused_lines.length} lines not turned into items`));
      doc.unused_lines.forEach((l) => details.append(el("div", "cite", l.id + " · " + l.text)));
      parts.push(details);
    }
    if (!parts.length) return empty("No plan items yet. Share a document from your clinician to start.");
    root.replaceChildren(...parts);
  }

  function renderTrend(d) {
    const obs = d.observations || [];
    if (!obs.length) return empty("No check-ins recorded yet. Missing days are not assumed to be normal.");
    const W = 640, H = 220, P = 32, ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Recorded pain scores over time");
    const x = (i) => P + (obs.length === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (obs.length - 1));
    const y = (v) => H - P - v * (H - 2 * P) / 10;
    const line = (x1, y1, x2, y2, color, dash) => { const l = document.createElementNS(ns, "line");
      Object.entries({ x1, y1, x2, y2, stroke: color, "stroke-width": 1.5, "stroke-dasharray": dash || "" }).forEach(([k, v]) => l.setAttribute(k, v)); svg.append(l); };
    const css = getComputedStyle(document.documentElement);
    line(P, y(0), W - P, y(0), css.getPropertyValue("--line"));
    (d.thresholds || []).forEach((t) => line(P, y(t), W - P, y(t), css.getPropertyValue("--warn"), "6 4"));
    const path = document.createElementNS(ns, "polyline");
    path.setAttribute("points", obs.map((o, i) => `${x(i)},${y(o.pain_score)}`).join(" "));
    path.setAttribute("fill", "none"); path.setAttribute("stroke", css.getPropertyValue("--accent")); path.setAttribute("stroke-width", 3);
    svg.append(path);
    obs.forEach((o, i) => { const c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", x(i)); c.setAttribute("cy", y(o.pain_score)); c.setAttribute("r", 5); c.setAttribute("fill", css.getPropertyValue("--accent")); svg.append(c); });
    const chart = el("div", "card"); chart.append(svg);
    if ((d.thresholds || []).length) chart.append(el("div", "meta", "Dashed line: threshold from your approved plan rule."));
    root.replaceChildren(chart, ...obs.slice().reverse().map((o) =>
      card("Pain score " + o.pain_score + " / 10", o.corrects_id ? "correction" : null, when(o.observed_at))));
  }

  function renderHandoff(d) {
    const h = (d.handoff || {}).data || d.handoff || {};
    const t = h.totals || {};
    const parts = [card(h.label || "Visit handoff", null, when(h.from_date) + " → " + when(h.to_date))];
    parts.push(card("Totals", null, `${t.plan_items || 0} plan items · ${t.task_events || 0} completed tasks · ${t.observations || 0} check-ins · ${t.alerts || 0} alerts · ${t.corrections || 0} corrections`));
    const section = (title, rows, fn) => { if (!rows || !rows.length) return; parts.push(el("h2", "", title)); rows.forEach((r) => parts.push(fn(r))); };
    section("Plan items", h.plan_items, (p) => { const c = card(p.text, p.status, p.type === "PLAN_RULE" ? "Follow-up rule" : "Task");
      ((p.source_citation || {}).page_excerpts || []).forEach((e) => c.append(el("div", "cite", "p." + e.page + " · " + e.excerpt))); return c; });
    section("Check-ins", h.observations, (o) => card("Pain score " + o.pain_score + " / 10", null, when(o.observed_at)));
    section("Alerts", h.alerts, (a) => card("Follow-up rule episode", a.status, (a.acknowledgements || []).length + " caregiver acknowledgement(s)"));
    section("Notes", h.uncertainties, (u) => card(u));
    root.replaceChildren(...parts);
  }

  function renderRecords(d, append) {
    const records = d.records || [];
    const cards = records.map((r) => card(r.type.toLowerCase().replaceAll("_", " "), r.status, when(r.observed_at || r.created_at)));
    if (append) root.append(...cards);
    else if (!records.length) empty("No matching records.");
    else root.replaceChildren(...cards);
  }

  // ---- handshake -----------------------------------------------------------
  request("ui/initialize", { protocolVersion: PROTOCOL, appInfo: { name: "careloop-" + VIEW, version: "1" }, appCapabilities: {} })
    .then((result) => {
      applyContext((result && result.hostContext) || {});
      notify("ui/notifications/initialized", {});
      // If the host sends no tool result (e.g. view opened directly), load the default view.
      setTimeout(() => { if (!loaded) load(); }, 800);
    })
    .catch(() => { note.textContent = "Open this view inside a CareLoop-enabled assistant."; });
  new ResizeObserver(reportSize).observe(document.body);
})();
</script>
</body>
</html>
